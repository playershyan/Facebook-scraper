<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraper Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="dashboard-title">Riyasewana Scraper Dashboard</h1>
            <div class="status-badge">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Initializing...</span>
            </div>
        </header>

        <main>
            <!-- Progress Section -->
            <section class="card">
                <h2>Progress</h2>
                <div class="progress-bar-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text">
                        <span id="progress-percentage">0%</span>
                        <span id="progress-details">0 / 0 pages</span>
                    </div>
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">Completed</div>
                        <div class="stat-value" id="stat-completed">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Remaining</div>
                        <div class="stat-value" id="stat-remaining">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Total</div>
                        <div class="stat-value" id="stat-total">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Errors</div>
                        <div class="stat-value error" id="stat-errors">0</div>
                    </div>
                </div>
            </section>

            <!-- Listings Section -->
            <section class="card">
                <h2>Listings</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">Found</div>
                        <div class="stat-value" id="listings-found">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Extracted</div>
                        <div class="stat-value" id="listings-extracted">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Saved</div>
                        <div class="stat-value" id="listings-saved">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Duplicates</div>
                        <div class="stat-value" id="listings-duplicates">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Failed</div>
                        <div class="stat-value error" id="listings-failed">0</div>
                    </div>
                </div>
            </section>

            <!-- Time Section -->
            <section class="card">
                <h2>Time</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">Elapsed</div>
                        <div class="stat-value" id="time-elapsed">0s</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Remaining</div>
                        <div class="stat-value" id="time-remaining">-</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Rate</div>
                        <div class="stat-value" id="time-rate">0/min</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">ETA</div>
                        <div class="stat-value" id="time-completion">-</div>
                    </div>
                </div>
            </section>

            <!-- Workers Section (Hidden if no workers) -->
            <section class="card" id="workers-section" style="display: none;">
                <h2>Workers</h2>
                <div id="workers-container" class="workers-container">
                    <div class="no-data">No workers active</div>
                </div>
            </section>
        </main>

        <footer>
            <div class="last-update">Last updated: <span id="last-update">Never</span></div>
            <div class="auto-refresh">Auto-refresh every 2s</div>
        </footer>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
